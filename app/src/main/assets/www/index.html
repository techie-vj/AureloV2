    <style id="splash-styles">
        /* ── Base splash styles (dark default) ── */
        #loading-screen{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#1a1208 0%,#0e0a04 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
        #loading-screen.hidden{opacity:0;transform:scale(1.04) translateY(-6px);pointer-events:none;transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1);}
        .ls-aura{position:absolute;width:560px;height:560px;background:radial-gradient(circle,rgba(255,160,50,.11) 0%,transparent 68%);filter:blur(72px);top:50%;left:50%;transform:translate(-50%,-52%);pointer-events:none;z-index:0;animation:lsAura 9s ease-in-out infinite alternate;}
        @keyframes lsAura{0%{transform:translate(-50%,-52%) scale(1);opacity:.8;}100%{transform:translate(-50%,-52%) scale(1.18);opacity:.5;}}
        .ls-grid{position:absolute;inset:0;pointer-events:none;opacity:1;z-index:0;background-image:linear-gradient(rgba(255,170,68,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,170,68,.025) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(circle at center,black 15%,transparent 68%);-webkit-mask-image:radial-gradient(circle at center,black 15%,transparent 68%);animation:lsGridDrift 22s linear infinite;}
        @keyframes lsGridDrift{from{transform:translate3d(0,0,0);}to{transform:translate3d(-28px,-28px,0);}}
        .ls-vignette{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 46%,transparent 0 28%,rgba(14,10,4,.18) 52%,rgba(14,10,4,.72) 100%);}
        .ls-mark{position:absolute!important;width:min(34vw,148px)!important;height:min(34vw,148px)!important;top:50%!important;left:50%!important;transform:translate(-50%,-54%)!important;pointer-events:none;z-index:2;}
        .ls-mark svg{width:100%!important;height:100%!important;overflow:visible!important;filter:drop-shadow(0 0 0px rgba(255,170,68,0));transition:filter .6s ease;}
        .ls-mark .ls-arch{stroke-dasharray:420;stroke-dashoffset:420;animation:lsStrokeDraw 2.8s cubic-bezier(.2,0,.6,1) forwards;animation-play-state:paused;}
        .ls-mark .ls-dot{opacity:0;transform:scale(0);transform-origin:54px 20px;animation:lsDotPop .45s cubic-bezier(.34,1.56,.64,1) 1.6s forwards;animation-play-state:paused;}
        .ls-mark.show svg{filter:drop-shadow(0 0 22px rgba(255,170,68,.4));}
        .ls-mark.show .ls-arch,.ls-mark.show .ls-dot{animation-play-state:running;}
        @keyframes lsStrokeDraw{from{stroke-dashoffset:420;}to{stroke-dashoffset:0;}}
        @keyframes lsDotPop{0%{opacity:0;transform:scale(0);}60%{opacity:1;transform:scale(1.35);}100%{opacity:1;transform:scale(1);}}
        .ls-wordmark{display:flex!important;align-items:flex-end!important;gap:1px!important;justify-content:center!important;margin-bottom:5px!important;opacity:0!important;transform:translateY(10px)!important;transition:opacity .6s ease .3s,transform .6s ease .3s!important;}
        .ls-wordmark-text{font-family:'Bodoni Moda','Didot',Georgia,serif!important;font-size:clamp(22px,5vw,28px)!important;font-weight:400!important;letter-spacing:3px!important;background:linear-gradient(135deg,#FFE082 30%,#FFAA44 70%)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;line-height:1!important;padding-bottom:3px!important;}
        .ls-sub-text{font-family:var(--ff-m,'system-ui')!important;font-size:var(--text-2xs)!important;letter-spacing:2px!important;text-transform:uppercase!important;color:rgba(255,255,255,.45)!important;}
        .ls-bar-wrap{width:128px!important;height:2px!important;border-radius:999px!important;background:rgba(255,255,255,.06)!important;overflow:hidden!important;animation:none!important;opacity:1!important;}
        .ls-bar{height:100%!important;width:0!important;background:linear-gradient(90deg,#FF7020,#FFAA44 50%,#FFE082)!important;border-radius:999px!important;box-shadow:0 0 14px rgba(255,170,68,.45)!important;animation:none!important;transition:width .12s ease!important;}

        /* ══════════════════════════════════════════════════
           LIGHT THEME SPLASH — PREMIUM REDESIGN
           Philosophy: clean white canvas, single warm light
           source behind the logo, everything else invisible.
           Inspired by Calm / Linear / Apple splash patterns.
        ══════════════════════════════════════════════════ */

        /* 1. BACKGROUND ─ pure white fading to the faintest warm ivory.
              No cream, no yellow — just clean paper with a breath of warmth. */
        :root[data-theme=light] #loading-screen {
            background:
                radial-gradient(ellipse 70% 50% at 50% 44%,
                    rgba(255, 200, 80, .08) 0%,
                    transparent 68%),
                linear-gradient(175deg,
                    #FFFFFF    0%,
                    #FEFDFB   45%,
                    #FAF6EF  100%)!important;
        }

        /* 2. AURA ─ large, ultra-soft champagne halo.
              Feels like sunlight through frosted glass, not a spotlight. */
        :root[data-theme=light] #loading-screen .ls-aura {
            width: 640px!important;
            height: 640px!important;
            top: 44%!important;
            background: radial-gradient(circle,
                rgba(255, 195, 70, .16) 0%,
                rgba(255, 155, 30, .06) 40%,
                transparent 68%)!important;
            filter: blur(88px)!important;
            opacity: 1!important;
            animation: lsAura 12s ease-in-out infinite alternate!important;
        }

        /* 3. GRID ─ removed entirely. It's visual noise on a light surface. */
        :root[data-theme=light] #loading-screen .ls-grid {
            opacity: 0!important;
            animation: none!important;
        }

        /* 4. VIGNETTE ─ gone. White edges are cleaner and more premium. */
        :root[data-theme=light] #loading-screen .ls-vignette {
            opacity: 0!important;
        }

        /* 5. LAYOUT ─ the single biggest fix.
              Logo pulled up to 44% so it visually centres between the top and
              the text block — no more huge dead zone in the lower half.
              CSS !important overrides the JS inline top:50% assignment. */
        :root[data-theme=light] .ls-mark {
            width:  min(38vw, 158px)!important;
            height: min(38vw, 158px)!important;
            top: 44%!important;
            transform: translate(-50%, -50%)!important;
        }

        /* 6. LOGO GLOW ─ wide, diffuse, champagne.
              Three layers: ambient haze → soft ring → subtle depth shadow. */
        :root[data-theme=light] .ls-mark.show svg {
            filter:
                drop-shadow(0 0 52px rgba(245, 175, 45, .28))
                drop-shadow(0 0 14px rgba(225, 120, 20, .22))
                drop-shadow(0  4px  8px rgba(140, 70,  0, .10))!important;
        }

        /* 7. COPY BLOCK ─ raised to balance with logo position.
              Sits comfortably above the home indicator / bottom inset. */
        :root[data-theme=light] #ls-copy {
            bottom: max(88px, 14vh)!important;
        }

        /* 8. MINI ARCH in wordmark ─ add subtle filter so the gold gradient
              reads on white (the pale #FFE082 end becomes nearly invisible). */
        :root[data-theme=light] #ls-title svg {
            filter: drop-shadow(0 0 5px rgba(200, 110, 0, .30))!important;
            opacity: 1!important;
        }

        /* 9. WORDMARK TEXT ─ deep warm gold, refined. Not orange — gold.
              The gradient goes dark-to-mid so it stays rich against white. */
        :root[data-theme=light] .ls-wordmark-text {
            background: linear-gradient(135deg,
                #92440A  0%,
                #BE6B14 38%,
                #DC8C2A 70%,
                #EFA84A 100%)!important;
            -webkit-background-clip: text!important;
            background-clip: text!important;
            -webkit-text-fill-color: transparent!important;
            font-size: clamp(24px, 5.5vw, 31px)!important;
            letter-spacing: 4px!important;
        }

        /* 10. TAGLINE ─ neutral warm-charcoal at 50% opacity.
               Clearly readable but doesn't compete with the wordmark. */
        :root[data-theme=light] #ls-sub {
            color: rgba(38, 28, 14, .50)!important;
            -webkit-text-fill-color: rgba(38, 28, 14, .50)!important;
            letter-spacing: 3px!important;
        }

        /* 11. STATUS TEXT ─ rich amber, full contrast.
               Previously nearly invisible at .78 opacity on white. */
        :root[data-theme=light] #ls-status {
            color: rgba(155, 78, 5, .82)!important;
            -webkit-text-fill-color: rgba(155, 78, 5, .82)!important;
        }

        /* 12. PROGRESS TRACK ─ whisper-thin, barely-there warm tint. */
        :root[data-theme=light] #ls-bar-wrap {
            background: rgba(130, 72, 4, .10)!important;
            height: 2px!important;
            width: 110px!important;
        }

        /* 13. PROGRESS BAR ─ warm amber-to-champagne gradient,
               soft glow that reads clearly against the white track. */
        :root[data-theme=light] #ls-bar {
            background: linear-gradient(90deg,
                #B85C08,
                #E08A22 50%,
                #F5B448)!important;
            box-shadow:
                0 0 12px rgba(215, 120, 15, .45),
                0 0  4px rgba(248, 160, 35, .35)!important;
        }

        /* ── Warm theme splash overrides ── */
        :root[data-theme=warm] #loading-screen {
            background:linear-gradient(160deg,#F5EFE4 0%,#EDE5D4 100%)!important;
        }
        :root[data-theme=warm] #loading-screen .ls-aura {
            background:radial-gradient(circle,rgba(180,120,30,.08) 0%,transparent 60%)!important;
            filter:blur(56px)!important;opacity:.7!important;
        }
        :root[data-theme=warm] #loading-screen .ls-grid { opacity:0!important; }
        :root[data-theme=warm] #loading-screen .ls-grid {
            background-image:linear-gradient(rgba(139,105,20,.07) 1px,transparent 1px),
                             linear-gradient(90deg,rgba(139,105,20,.07) 1px,transparent 1px)!important;
        }
        :root[data-theme=warm] #loading-screen .ls-vignette {
            background:radial-gradient(circle at 50% 46%,transparent 0 30%,rgba(200,180,140,.20) 60%,rgba(180,155,110,.45) 100%)!important;
        }
        :root[data-theme=warm] .ls-wordmark-text {
            background:linear-gradient(135deg,#8B6914 30%,#C47D2E 70%)!important;
            -webkit-background-clip:text!important;background-clip:text!important;
            -webkit-text-fill-color:transparent!important;
        }
        :root[data-theme=warm] .ls-sub-text { color:rgba(100,80,40,.65)!important; }
        :root[data-theme=warm] .ls-bar-wrap { background:rgba(139,105,20,.15)!important; }
        :root[data-theme=warm] .ls-bar { box-shadow:none!important; }
    </style>
</head>

<script id="splash-script">
    (function(){
      'use strict';
      const MIN_MS=3400,TIPS=['Organizing your space…','Take a deep breath…','Data stays on device','Focus on what matters','Setting your focus…'];
      const T_LOGO_START=60,T_LOGO_FADE=480;
      const screen=document.getElementById('loading-screen'),logoEl=document.getElementById('ls-logo'),statusEl=document.getElementById('ls-status'),barEl=document.getElementById('ls-bar');
      if(!screen)return;
      function resize(){const W=window.innerWidth,H=window.innerHeight;if(logoEl){logoEl.style.left=(W/2)+'px';logoEl.style.top=(H/2)+'px';}}
      window.addEventListener('resize',resize);resize();
      let bootTs=Date.now(),skipped=false,raf=null,logoShown=false,textShown=false,tipIndex=-1,finished=false;
      function _showText(){var t=document.getElementById('ls-title'),s=document.getElementById('ls-sub'),st=document.getElementById('ls-status'),bw=document.getElementById('ls-bar-wrap');if(t){t.style.setProperty('opacity','1','important');t.style.setProperty('transform','translateY(0)','important');}if(s){s.style.setProperty('opacity','1','important');s.style.setProperty('transform','translateY(0)','important');}if(st)st.style.setProperty('opacity','1','important');if(bw)bw.style.setProperty('opacity','1','important');}
      screen.addEventListener('click',function(){skipped=true;if(logoShown&&!textShown){textShown=true;_showText();}});
      function updateTip(e){const idx=Math.min(Math.floor(e/820),TIPS.length-1);if(idx!==tipIndex){tipIndex=idx;statusEl.style.opacity='0';setTimeout(function(){statusEl.textContent=TIPS[idx];statusEl.style.opacity='1';},300);}}
      function updateBar(e){const p=Math.min(0.92,e/MIN_MS),ea=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;barEl.style.width=(ea*100)+'%';}
      function tick(){
        const elapsed=skipped?MIN_MS+100:(Date.now()-bootTs);
        if(!textShown&&elapsed>=T_LOGO_START+T_LOGO_FADE){textShown=true;_showText();}
        if(!logoShown&&elapsed>=T_LOGO_START){logoShown=true;logoEl.classList.add('show');}
        updateTip(elapsed);updateBar(elapsed);
        if(elapsed>=MIN_MS&&!finished){
          finished=true;cancelAnimationFrame(raf);
          statusEl.style.opacity='0';setTimeout(function(){statusEl.textContent='Ready ✦';statusEl.style.opacity='1';},200);
          barEl.style.transition='width .28s cubic-bezier(.4,0,.2,1)';barEl.style.width='100%';
          setTimeout(function(){screen.classList.add('hidden');setTimeout(function(){if(typeof splashRelease==='function')splashRelease();else if(typeof checkPermissions==='function')checkPermissions();},580);},320);
          return;
        }
        raf=requestAnimationFrame(tick);
      }
      window.splashSkip=function(){skipped=true;};
      if(statusEl)statusEl.textContent=TIPS[0];tipIndex=0;
      raf=requestAnimationFrame(tick);
    })();
</script>
