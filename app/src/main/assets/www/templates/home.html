<!-- ══ HOME ══════════════════════════════════════ -->
<div class="screen active" id="screen-home">
    <div class="app-top-bar">
        <div style="display:flex;align-items:center;gap:0px">
            <!-- Aurelo integrated wordmark -->
            <div style="display:flex;align-items:flex-end;gap:1px">
                <svg width="21" height="21" viewBox="0 0 108 108" fill="none" style="flex-shrink:0;margin-bottom:1px">
                    <defs>
                        <linearGradient id="hGa" x1="28" y1="20" x2="80" y2="90" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFE082"/><stop offset="55%" stop-color="#FFAA44"/><stop offset="100%" stop-color="#FF7020"/></linearGradient>
                        <linearGradient id="hDa" x1="48" y1="22" x2="60" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFF3C0"/><stop offset="100%" stop-color="#FFD060"/></linearGradient>
                        <linearGradient id="hTa" x1="0" y1="90" x2="0" y2="26" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="white" stop-opacity="1"/><stop offset="100%" stop-color="white" stop-opacity="0.22"/></linearGradient>
                        <mask id="hMa"><rect width="108" height="108" fill="url(#hTa)"/></mask>
                    </defs>
                    <g mask="url(#hMa)"><path d="M 22 88 C 22 88 30 30 54 20 C 78 30 86 88 86 88" stroke="url(#hGa)" stroke-width="7.5" fill="none" stroke-linecap="round"/></g>
                    <path d="M 22 88 C 22 88 30 30 54 20 C 78 30 86 88 86 88" stroke="url(#hGa)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
                    <circle cx="54" cy="20" r="5.5" fill="url(#hDa)"/>
                </svg>
                <span id="tidy-header-title" class="aurelo-logo-txt" style="font-family:var(--ff-d);font-size:20px;font-weight:400;background:linear-gradient(135deg,#FFE082 30%,#FFAA44 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;line-height:1;padding-bottom:2px">URELO</span>
            </div>
            <span id="pro-pill" style="display:none;margin-left:7px;padding:2px 8px 2px 6px;border-radius:40px;background:rgba(247,201,72,0.12);border:1px solid rgba(247,201,72,0.25);color:#f7c948;font-size: var(--text-2xs);font-weight:700;font-family:var(--ff-m);letter-spacing:0.08em;vertical-align:middle">✦ PRO</span>
        </div>
        <div style="cursor:pointer;width:36px;height:36px;border-radius:10px;background:var(--s1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center" onclick="activateTab('settings')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--t2)"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
        </div>
    </div>

    <!-- ── REORDERED: Score card FIRST (emotional anchor) ─────────────────────────── -->
    <div id="home-aurelo-score" style="margin-bottom:12px"></div>

    <!-- ── Quick stats strip (now supporting detail) ─────────────────────────── -->
    <div class="home-quick-strip" onclick="activateTab('wellness')" role="button" tabindex="0" aria-label="Open wellness details">
        <div id="home-status-line" class="home-status-line">✅ <span id="home-status-text">On track today</span></div>
        <div class="home-kpi-grid">
            <div class="home-kpi-pill">
                <div class="home-kpi-value" id="qs-today">–</div>
                <div class="home-kpi-label">Screen time</div>
            </div>
            <div class="home-kpi-pill">
                <div class="home-kpi-value is-alert" id="qs-pickups">–</div>
                <div class="home-kpi-label">Pickups</div>
            </div>
            <div class="home-kpi-pill">
                <div class="home-kpi-value is-streak" id="qs-streak">–</div>
                <div class="home-kpi-label">Streak</div>
            </div>
        </div>
        <div class="home-progress-wrap">
            <div class="home-goal-bar-wrap home-goal-bar-wrap--slim">
                <div class="home-goal-bar-fill" id="home-goal-fill"></div>
            </div>
            <div class="home-goal-meta home-goal-meta--compact">
                <span id="home-goal-pct" class="home-goal-pct-text">0%</span>
                <span id="home-goal-label" class="home-goal-lbl-text">of 4h goal</span>
            </div>
        </div>
    </div>

    <!-- ── Health Connect promo banner (rendered by app-health-connect.js) ── -->
    <div id="hc-home-banner" style="padding:0 16px;margin-bottom:12px;display:none" onclick="if(typeof openSettingsWithHC==='function'){openSettingsWithHC();}else{activateTab('settings');requestAnimationFrame(()=>toggleHCSettingsSection&&toggleHCSettingsSection(true));}" role="button" tabindex="0"></div>

    <!-- ── Focus dynamic row ──── -->
    <div id="home-focus-dynamic" style="padding:0 14px;margin-bottom:16px"></div>
    <!-- ── Habits dynamic row ──── -->
    <div id="home-habits-dynamic" style="padding:0 14px;margin-bottom:16px"></div>

    <!-- Coach insight anchor — independent of HC banner -->
    <div id="coach-home-insight-anchor"></div>

    <!-- ── First-run snapshot card ── -->
    <div id="first-run-card" style="display:none">
        <div class="frc-icon" id="frc-icon">✨</div>
        <div style="flex:1;min-width:0">
            <div class="frc-title" id="frc-title">Your snapshot is ready</div>
            <div class="frc-body" id="frc-body">Tap any section to explore your data.</div>
        </div>
        <span id="first-run-card-close" onclick="dismissFirstRunCard()">×</span>
    </div>

    <!-- ── CONTEXTUAL INSIGHT BANNER (moved up, softer design) ──── -->
    <div id="home-insight-banner" class="home-insight-banner home-insight-banner--contextual" style="display:none" onclick="onInsightBannerAction()" onkeydown="onInsightBannerKeydown(event)">
        <div id="hib-icon" class="hib-icon">⚠️</div>
        <div style="flex:1;min-width:0">
            <div id="hib-title" class="hib-title"></div>
            <div id="hib-body" class="hib-body"></div>
        </div>
        <div onclick="event.stopPropagation(); dismissInsightBanner()" class="hib-close" role="button" tabindex="0" aria-label="Dismiss insight">×</div>
    </div>
    <div id="ghost-banner" style="display:none"><div id="ghost-banner-sub"></div></div>

    <!-- legacy stubs — JS backward compat -->
    <div id="home-focus-strip" style="display:none"></div>
    <div id="home-focus-score" style="display:none"></div>
    <div id="home-limits-strip" style="display:none"></div>

    <div id="home-timer-alert" style="padding:0 16px;margin-bottom:10px;display:none"></div>
    <div id="home-sleep-card" style="padding:0 16px;margin-bottom:10px;display:none"></div>

    <!-- ── Time-slot Routine (contextual app suggestions) ─────────────────────────── -->
    <div class="home-section-hdr">
        <div>
            <div class="home-section-title" id="routine-slot-label">Afternoon Picks</div>
            <div class="home-section-sub" id="routine-slot-sub">Based on your habits</div>
        </div>
        <div id="routine-learn-badge" class="routine-learn-badge" style="display:none"></div>
    </div>
    <div class="recent-row" id="recent-row"></div>

    <!-- ── Dynamic Culprits / Most Used Apps ─────────────────────────── -->
    <div id="home-culprits-section" style="padding:0 16px;margin-bottom:24px;display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:7px">
                <div id="home-culprits-label" style="font-family:var(--ff-m);font-size: var(--text-2xs);letter-spacing:1.5px;color:var(--r)">TOP APPS TODAY</div>
                <span id="home-culprits-count" style="display:none;font-family:var(--ff-m);font-size: var(--text-2xs);color:var(--t3);background:var(--s2);border:1px solid var(--border2);border-radius:99px;padding:1px 7px"></span>
            </div>
            <div onclick="openAllApps()" style="font-family:var(--ff-m);font-size: var(--text-2xs);color:var(--p);cursor:pointer">See all →</div>
        </div>
        <div id="home-culprits-list"></div>
    </div>

    <!-- ── Category Summary Strip ────────────────────────────────── -->
    <div id="home-cat-summary" style="padding:0 16px;margin-bottom:12px;display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:7px">
                <div style="font-family:var(--ff-m);font-size: var(--text-2xs);letter-spacing:1.5px;color:var(--t3)">TOP CATEGORIES TODAY</div>
                <span id="home-cat-count" style="display:none;font-family:var(--ff-m);font-size: var(--text-2xs);color:var(--t3);background:var(--s2);border:1px solid var(--border2);border-radius:99px;padding:1px 7px"></span>
            </div>
            <div onclick="openAllCatsPanel()" style="font-family:var(--ff-m);font-size: var(--text-2xs);color:var(--p);cursor:pointer">View all →</div>
        </div>
        <div id="home-cat-summary-list"></div>
    </div>

    <!-- Hidden stubs -->
    <div id="notif-dot" style="display:none"></div>
    <div style="height:20px"></div>
</div>
